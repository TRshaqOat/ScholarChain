# ScholarChain configuration reference. Owner: domain-engineer. Version: see config-version.
#
# Precedence, highest first (scholarchain.core.config.ConfigLoader):
#   1. Environment variables named in ConfigLoader.EnvOverrides (SCHOLARCHAIN_BUCKET, ...).
#   2. The HOCON file named by SCHOLARCHAIN_CONFIG_FILE, when set (it must exist).
#   3. This file (on the core classpath).
# JVM system properties and other environment variables are not consulted.
#
# Environment-specific values below are FAKE placeholders ("example-" prefix, ".invalid" host,
# account 000000000000, also inside ARNs, "example-" model IDs). The loader rejects them unless
# application.environment = "local". Real values come only from layers 1 and 2.
# Numeric thresholds and algorithm parameters marked PROVISIONAL are starting values for their
# owning agent to evaluate and justify; they are not calibrated.

scholarchain {
  config-version = "config-v1"

  application {
    environment = "local"            # SCHOLARCHAIN_ENVIRONMENT
    region = "us-east-2"             # D-04; SCHOLARCHAIN_AWS_REGION
    aws-account-id = "000000000000"  # fake; SCHOLARCHAIN_AWS_ACCOUNT_ID
  }

  # One bucket per environment (Phase 7 rulings 7 and 20), created by Terraform. The former keys
  # raw-bucket, curated-bucket, graph-bucket, and rag-bucket are rejected by the loader. Key layout per
  # prefix: modules/storage/STORAGE.md. Every key below a prefix carries snapshot=<date>/run=<runId>,
  # for example raw/<dataset>/snapshot=<date>/run=<runId>/ (ruling 22).
  storage {
    bucket = "example-scholarchain"  # SCHOLARCHAIN_BUCKET
    # Top-level key prefixes (ruling 7). Each is one lower-case segment ending in "/".
    prefixes {
      raw = "raw/"
      curated = "curated/"
      graph = "graph/"                         # Neptune bulk-load CSV only
      semantic-context = "semantic-context/"   # rendered text
      vectors = "vectors/"                     # vector backup
      reports = "reports/"
      logs = "logs/"                           # write-once runtime audit records (ruling 22)
      runs = "runs/"                           # run manifests
    }
  }

  neptune {
    endpoint = "neptune.example.invalid"  # SCHOLARCHAIN_NEPTUNE_ENDPOINT
    port = 8182                           # SCHOLARCHAIN_NEPTUNE_PORT
    query-timeout-ms = 5000               # PROVISIONAL; SCHOLARCHAIN_NEPTUNE_QUERY_TIMEOUT_MS
    # IAM role the Neptune bulk loader assumes to read graph/ (Phase 7 M10; storage LoadNeptuneCli).
    loader-role-arn = "arn:aws:iam::000000000000:role/example-neptune-loader"  # fake; SCHOLARCHAIN_NEPTUNE_LOADER_ROLE_ARN
  }

  # DynamoDB (Phase 7 M10). Physical table name = table-prefix + logical table name
  # (modules/storage/STORAGE.md). Characters A-Z a-z 0-9 _ . - only, 1 to 200 of them.
  dynamodb {
    table-prefix = "example-scholarchain-"  # fake; SCHOLARCHAIN_DYNAMODB_TABLE_PREFIX
  }

  s3-vectors {
    vector-bucket = "example-scholarchain-vectors"  # SCHOLARCHAIN_VECTOR_BUCKET
    indexes {
      researchers = "researcher-profile-v1"
      communities = "collaboration-community-v1"
      abstracts = "paper-abstract-v1"
      paths = "collaboration-path-v1"
      topic-institutions = "topic-institution-summary-v1"
    }
  }

  # Owner of the values: entity-resolution-engineer (calibrated in Phase 5).
  # Invariant checked by the loader: 0 <= reject <= llm-band-min <= llm-band-max <= accept <= 1.
  entity-resolution {
    policy-version = "er-v2"   # SCHOLARCHAIN_ER_POLICY_VERSION
    accept-threshold = 0.93    # PROVISIONAL (spec example)
    reject-threshold = 0.35    # PROVISIONAL (spec example)
    llm-band-min = 0.65        # PROVISIONAL (spec example)
    llm-band-max = 0.93        # PROVISIONAL (spec example)
    # Blocking (Hadoop J05/J06): a block with more members than this is re-keyed with fallback
    # keys; blocks still larger are counted as oversize. Must be >= 1.
    # Calibrated in Phase 5 (docs/agent-runs/phase-05/evidence/block-size.tsv): 150 is the smallest
    # value with no oversize blocks; 5.92M candidates, silver recall 0.8533, mention connectivity 0.9908.
    max-block-size = 150               # SCHOLARCHAIN_ER_MAX_BLOCK_SIZE
    # Exact-identifier conflicts (Hadoop J03/J04): conflict output per identifier group is capped
    # at this many members; larger groups are counted as oversize conflicts. Must be >= 1.
    max-conflict-group-size = 100      # PROVISIONAL; SCHOLARCHAIN_ER_MAX_CONFLICT_GROUP_SIZE
  }

  graph {
    policy-version = "graph-v1"     # SCHOLARCHAIN_GRAPH_POLICY_VERSION
    # Teams larger than this are counted and reported as oversize by pair expansion.
    oversize-team-threshold = 100   # PROVISIONAL
    # D-10: three fixed inclusive windows. "all-years" equals the DBLP subset year range
    # (datasets/config/subset.v1.json year_min..year_max); widen it if the subset widens.
    windows = [
      { name = "all-years", start-year = 2000, end-year = 2026 }
      { name = "2000-2014", start-year = 2000, end-year = 2014 }
      { name = "2015-2026", start-year = 2015, end-year = 2026 }
    ]
  }

  # Community and bridge-algorithm parameters (D-10: DataFrame iteration, no GraphFrames).
  # Owner of the values: spark-engineer.
  analytics {
    community-algorithm = "label-propagation"
    community-max-iterations = 20   # PROVISIONAL
    kcore-max-iterations = 100      # PROVISIONAL
    checkpoint-interval = 5         # PROVISIONAL
    bridge-measures = ["CROSS_COMMUNITY_DEGREE", "COMMUNITIES_CONNECTED", "PARTICIPATION_COEFFICIENT"]
    # Entries per stored RANKING# item (metric x window top-N). One key for the producer (Spark) and
    # the runtime, which reports any request beyond it as not stored (Phase 9 ruling 6).
    ranking-size = 50
  }

  retrieval {
    graph-limit = 100              # PROVISIONAL
    vector-limit = 50              # PROVISIONAL
    max-path-depth = 6             # PROVISIONAL
    context-token-budget = 12000   # PROVISIONAL
    fusion-policy-version = "fusion-v1"
  }

  # Phase 9 ruling 3: the planner and synthesis model is Claude Haiku 4.5 (Bedrock inference
  # profile) in every environment, so it is a real default, not a placeholder.
  models {
    embedding-model = "example-embedding-model"        # SCHOLARCHAIN_EMBEDDING_MODEL_ID
    planner-model = "us.anthropic.claude-haiku-4-5-20251001-v1:0"    # SCHOLARCHAIN_PLANNER_MODEL_ID
    synthesis-model = "us.anthropic.claude-haiku-4-5-20251001-v1:0"  # SCHOLARCHAIN_SYNTHESIS_MODEL_ID
    # Unused in Phase 9 (verification is deterministic, ruling 3).
    verification-model = "example-verification-model"  # SCHOLARCHAIN_VERIFICATION_MODEL_ID
    adjudication-model = "example-adjudication-model"  # SCHOLARCHAIN_ADJUDICATION_MODEL_ID
  }

  operations {
    # Deadline of a synchronous POST /v1/query (Phase 10 ruling 7; live answers took 10 to 33 s),
    # passed to RuntimeApi.answer. It is cooperative: a model attempt already running can overrun it
    # by up to runtime.llm.timeout-ms, and the service maps a passed deadline to 504.
    synchronous-deadline-ms = 40000
    max-workflow-retries = 2         # PROVISIONAL; unused (the services add no LLM retries, ruling 9)
    max-concurrent-llm-calls = 8     # PROVISIONAL; unused
  }

  # Graph-RAG runtime (Phase 9; owner of the values: rag-engineer, modules/rag/RUNTIME.md section 20).
  # Every value is PROVISIONAL unless a ruling is named. Every integer must be >= 1.
  runtime {
    prompts-dir = "prompts"   # SCHOLARCHAIN_PROMPTS_DIR; versioned prompt files
    question {
      max-chars = 2000
      deadline-ms = 180000    # per question (CLI)
    }
    planner {
      prompt-version = "planner-v2"  # Phase 9 ruling 30; output schema planner-output-v1 unchanged
      max-output-tokens = 800
      max-operations = 6
      max-researcher-names = 4
      max-term-chars = 200
      max-filter-terms = 5    # topics, venues, institutions each
    }
    synthesis {
      prompt-version = "synthesis-v3"  # Phase 10 work order 1 (ruling 31); the prompt file names its output schema
      max-output-tokens = 4000         # Phase 10 work order 1: max-claims 20 x 200 tokens per claim
      max-claims = 20
    }
    llm {
      requests-per-minute = 8     # ruling 11: 1 to 8 (quota 10); every attempt passes the throttle
      max-attempts-per-call = 2   # ruling 3: 1 to 2 (one bounded retry)
      timeout-ms = 30000
      temperature = 0.0           # 0 to 1
    }
    embedding {
      requests-per-minute = 50    # ruling 11: 1 to 50
      timeout-ms = 10000
    }
    resolver {
      policy-version = "dominant-name-v1"   # ruling 5
      dominant-share = 0.9                  # ruling 5, Phase 7 ruling 30; above 0.5, at most 1
      dominant-min-works = 5                # ruling 5, Phase 7 ruling 30
      max-candidates = 500                  # 1 to 1000
      candidate-coauthors = 3
      candidate-institutions = 3
    }
    rankings {
      default-top-n = 10    # at most analytics.ranking-size and runtime.rankings.max-top-n
      max-top-n = 1000      # plan validation bound
    }
    semantic {
      top-k = 5             # hits per index
      max-indexes = 3       # indexes per question
    }
    budget {
      graph-evidence-tokens = 8000      # graph + semantic at most retrieval.context-token-budget
      semantic-context-tokens = 3000
      max-evidence-items = 300
      chars-per-token = 3
      max-input-tokens-per-question = 40000
      # 2 calls x max-attempts-per-call 2: 2 x 800 (planner) + 2 x 4000 (synthesis) = 9600
      max-output-tokens-per-question = 9600
    }
    audit {
      ttl-days = 30         # Phase 7 ruling 22; QuerySession and EvidenceBundle items
    }
    window-summary {
      # Phase 10 work order 10: the load run of the corpus window-summary object served to the
      # runtime (modules/storage STORAGE.md, "Window summaries"). Empty: none served, so corpus
      # questions abstain. Otherwise run-<32 lower-case hex>.
      load-run = ""         # SCHOLARCHAIN_WINDOW_SUMMARY_RUN
    }
  }

  # Bounds of the storage graph read templates, live and fake alike (Phase 9 ruling 7; owner of
  # the values: storage-engineer). Every value is PROVISIONAL and must be >= 1.
  graph-read {
    max-results = 1000
    id-batch-size = 100
    path-max-frontier = 50000
    path-timeout-ms = 20000
    community-members-limit = 100
    community-neighbors-limit = 20
    community-facet-member-cap = 2000
    facet-limit = 10
    lookup-limit = 20
    max-lookup-ids = 10
    neighbors-max-depth = 3
    neighbors-max-limit = 200
  }

  # Phase 10 REST services and worker (modules/services; owner of the values: service-engineer).
  # Every value is PROVISIONAL unless a ruling is named. Every integer must be >= 1. The synchronous
  # deadline is operations.synchronous-deadline-ms; the question length limit is
  # runtime.question.max-chars; the worker runs each job under runtime.question.deadline-ms.
  services {
    # Ruling 10: answers use no language model (rule planner, template synthesis) unless this is
    # false. Live model use is an explicit opt-in, as --live is for the CLIs. /v1/explain reports it.
    stub-llm = true                       # SCHOLARCHAIN_STUB_LLM
    metrics-enabled = true                # GET /metrics on every service (ruling 1)
    # Ruling 5: NAME of the environment variable holding the API key (ECS injects it from Secrets
    # Manager). Never the key. The loader never reads this variable into configuration.
    api-key-env = "SCHOLARCHAIN_API_KEY"
    # Request body cap (ruling 6): a 2000-char question JSON-escaped at 6 bytes per char (12000) plus
    # 3 x 5 filter terms of 200 chars (18000) is about 30 KiB; 64 KiB leaves twice that.
    max-body-bytes = 65536
    # Requests waiting for a thread, per service; beyond it the service answers 503.
    max-queued-requests = 64

    query-api {
      port = 8080
      # A sync query holds a thread up to the deadline, and the model throttle (8 per minute)
      # serializes model calls anyway, so more threads only wait longer.
      threads = 8
      # Accepted POST /v1/query per minute per instance (ruling 6, 429): at 2 to 4 model calls per
      # question and 8 calls per minute, one instance answers 2 to 4 live questions per minute.
      query-rate-per-minute = 10
    }
    graph-evidence-api {
      port = 8081
      threads = 16                        # bounded store reads only, no model calls
    }
    worker {
      port = 8082                         # health, readiness, and metrics only
      threads = 2
      concurrency = 1                     # jobs in flight per worker; model quota (ruling 10)
      poll-wait-seconds = 20              # SQS long poll, 1 to 20
      # Must exceed runtime.question.deadline-ms + runtime.llm.timeout-ms (180 s + 30 s; the
      # deadline is cooperative) so a running job's message never reappears; at most 43200 (SQS).
      visibility-timeout-seconds = 300
    }
    # The job queue and its dead-letter queue are created by Terraform (Phase 12). The redrive
    # policy there must use the same max-receive-count (1 to 1000).
    queue {
      url = "https://sqs.us-east-2.amazonaws.com/000000000000/example-scholarchain-jobs"  # fake; SCHOLARCHAIN_JOB_QUEUE_URL
      dead-letter-url = "https://sqs.us-east-2.amazonaws.com/000000000000/example-scholarchain-jobs-dlq"  # fake; SCHOLARCHAIN_JOB_DLQ_URL
      max-receive-count = 3               # SCHOLARCHAIN_JOB_MAX_RECEIVE_COUNT
    }
    # DynamoDB TTL (attribute expiresAt, ruling 11). idempotency-hours <= job-hours <=
    # runtime.audit.ttl-days x 24, so a stored reference never outlives what it points to.
    ttl {
      idempotency-hours = 24
      job-hours = 168
    }
    evidence-max-content-chars = 2000     # GET /v1/evidence text cap (ruling 8)
    # Ruling 9: reads only, retryable errors only. Same meaning as the storage RetryPolicy
    # (attempts include the first; delay before retry n = min(max-delay-ms, base-delay-ms x 2^(n-1))).
    # One circuit breaker per downstream opens after breaker-failure-threshold consecutive failures
    # and fails fast for breaker-open-ms.
    resilience {
      max-attempts = 3
      base-delay-ms = 100
      max-delay-ms = 1000
      breaker-failure-threshold = 5
      breaker-open-ms = 30000
    }
    # Client-side timeout of one downstream call. neptune-ms is at least neptune.query-timeout-ms, so
    # the server-side query timeout fires first. An SQS receive waits poll-wait-seconds longer. The
    # model and embedding timeouts are runtime.llm.timeout-ms and runtime.embedding.timeout-ms.
    timeouts {
      neptune-ms = 6000
      dynamodb-ms = 2000
      s3-ms = 5000
      s3-vectors-ms = 5000
      sqs-ms = 5000
    }
  }
}

# Spark analytics defaults. Owner: spark-engineer.
# Every key can be overridden with a command-line flag of the same name (--shuffle-partitions 64).
# Graph windows, the graph policy version, and analytics parameters come from the core
# configuration (ConfigLoader); this file holds only Spark-job settings.
scholarchain-spark {
  # Fallback master (ruling 25): used only when spark.master is not already set. spark-submit
  # --master (YARN on EMR) sets spark.master and then this value and the --master flag are ignored;
  # a local sbt runMain has no spark.master and runs local[*].
  master = "local[*]"
  # Set explicitly (ruling 17). 10 cores locally; AQE may coalesce further.
  shuffle-partitions = 40
  # Output root; runs land in <out>/snapshot=<dblp snapshot>/run=<runId>/. Any Hadoop FileSystem URI.
  out = "scratch/spark"
  # Reliable checkpoints of iterative jobs (connected components); one subdirectory per run.
  checkpoint-dir = "scratch/spark/checkpoints"
  # Version of the two-tier clustering and refusal rules (phase-06 rulings 4 to 6). Researcher IDs
  # are scr:<this>.<er policy version>:<hash>, so a rule change gives new IDs.
  canonical-policy-version = "canon-v1"
  # Upper bound on large-star/small-star rounds per connected-components call; the run fails if a
  # call has not converged by then (it needs O(log^2 n) rounds).
  cc-max-iterations = 60
  # CommunityPathJob (jobs 5 to 7). Label-propagation round cap (ruling 8: default 10; reaching it
  # is recorded as not converged, not a failure). The core analytics.community-max-iterations is
  # not used: ruling 15 puts Spark job settings here.
  community-max-iterations = 10
  # Bounded BFS depth for path evidence (ruling 11).
  path-max-depth = 6
  # Without --pairs: this many seeded pairs from the largest component of the first window.
  path-sample-pairs = 50
  # Seeded BFS sources per window for the average-path-length / effective-diameter estimate.
  path-sample-sources = 20
  # Seed of both samples (rank by H(seed, ...)); part of the run fingerprint.
  sample-seed = 20261003
  # TemporalSummaryExportJob (job 10, ruling 12 and work order 5): researcher profiles for
  # researchers with at least this many publications in the first window, and community summaries
  # for communities of at least this many members (every window).
  summary-min-publications = 2
  summary-min-community-size = 3
  # The run stops before free space on a local output volume drops below this (ruling 17).
  min-free-disk-gib = 5
}

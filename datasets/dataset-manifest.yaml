      full_unavailable_ids_404_409_410: "25, all HTTP 409 (unavailable-ids.txt; raw/<iD>.http409 markers); 0 answered 404 or 410"
      full_records_jsonl_gz_bytes: 237831658
      full_records_with_work_dois: "17,632 of 22,975 records (76.7%) list at least one work external-id of type doi (17,579 distinct iDs); 14,106 distinct iDs list a work DOI that equals a DBLP subset DOI (dois.txt, lower-cased)"
      full_coverage_of_candidate_ids: "22,975 of 111,166 candidate iDs returned a record (20.7%); 23,000 selected (20.7%); 25 unavailable"
      full_coverage_of_dblp_ids: "All 23,000 selected iDs are DBLP iDs (classes b and a). 22,975 of 64,493 DBLP iDs returned a record (35.6%); 22,908 of 64,493 (35.5%) appear as a returned record's own orcid-identifier.path"
      full_coverage_of_openalex_ids: "18,868 of 104,338 OpenAlex authorship iDs (18.1%) appear as a returned record's orcid-identifier.path"
    s3_raw_prefix: "s3://<raw-bucket>/orcid/snapshot=2026-11-03/"
    integrity_policy: "No provider checksum exists. Each record is checked for orcid-identifier.path before it is gzip-compressed. iDs are format-checked (and checksum-checked when they come from DBLP) before they are used in a URL. 404, 409, and 410 answers are recorded as markers. SHA256SUMS and run-info.json are written at completion. The fictional test record is checked for the configured iD and for the self-declared marker 'fictitious person' in its biography; otherwise it is refused (exit 4). Committed ORCID sample files are covered by datasets/samples/SHA256SUMS."
    schema_version: "orcid-api-v3.0/record"
    schema_note: datasets/schemas/orcid.md
    subset_rule: "Candidates: the union of ORCID iDs from DBLP (subset <author orcid> attributes and subset-author person records) and from fetched OpenAlex authorships; no other iD is requested. Selection (fetch_orcid.sh select_ids; human ruling phase-05 repair-01): priority classes (b) iDs from DBLP person records, then (a) remaining iDs in both DBLP and OpenAlex, then (c) remaining iDs from DBLP author elements, then (d) remaining OpenAlex-only iDs; the first orcid.full_max_ids = 23,000 (--full) or orcid.sample_max_ids = 30 (SAMPLE) are kept. Classes (b), (c), (d) are in iD string order (LC_ALL=C). In --full, class (a) is ranked by the number of distinct subset works the iD appears on, highest first, ties by iD string order (LC_ALL=C). Works are counted by dblp_extract.py --pass orcid-work-counts over the DBLP works.xml and the OpenAlex works.jsonl of the same full run: a DBLP subset record counts when one of its <author orcid> attributes carries the iD (checksum-valid, as in orcids-works.txt), and its identity is its DBLP key; an OpenAlex work counts when authorships[].author.orcid carries the iD (as in orcids.txt), and its identity is the DBLP key of the subset record with the same DOI (DOIs lower-cased on both sides, the DBLP side html-unescaped from <ee> doi.org links, as in dois.txt; lowest key if several records share it), else doi:<DOI>, else openalex:<id>. So a DBLP appearance and an OpenAlex appearance of the same work count once only when the DOIs match; a DBLP record without a DOI is never matched to an OpenAlex work. DBLP person records contribute no works. SAMPLE uses the same class order but keeps class (a) in iD string order, so the completed SAMPLE ids.txt is unchanged (SAMPLE class (b) is empty). The run directory records ids.txt (selected list in order) and selection.json (available and selected per class, class_order, class_a_ranking with basis and the min and max work counts among selected class (a) iDs, work_linkage counts, config sha256). Crossref ORCIDs do not drive fetches. Committed samples (decision-1): only orcid.fictional_test_record_id from the config, plus hand-authored synthetic records whose work_dois come from datasets/samples/dblp/dois.txt."
    incremental_update_strategy: "Re-fetch only for a new DBLP snapshot (no continuous polling, per the Terms). Changes are detected with history.last-modified-date. iDs that answered 404, 409, or 410 are re-checked only on a new snapshot."
    linkage_fields: [orcid, work_dois, name, other_names, employments.org_id, external_ids]
    privacy_notes: "ORCID records are personal data that researchers chose to make public: names, employment history, and identifiers. Purpose limitation is scholarly collaboration analysis only. The projection drops biography, emails, addresses, keywords, and researcher URLs. Raw and minimized real records stay in git-ignored scratch and the private raw bucket, never in the repository (decision-1). The committed fictional test record describes a fictitious person. The synthetic records describe no person, use 'synthetic:' identifiers, and share no name with any author in the committed samples (checked by validate.sh)."
    known_limitations:
      - "Coverage depends on researchers making data public, so many fields are empty."
      - "The full run is capped at 23,000 of 111,166 candidate iDs to fit one anonymous quota day with a 2,000-read retry margin. On the 2026-10-03 inputs it fetches all 4,146 class (b) iDs and the 18,854 class (a) iDs with the most subset works (every iD with 3 or more, plus 100 of the 9,994 with exactly 2, chosen by iD string order); no class (c) or (d) iD and no class (a) iD with a single work is fetched. The ranking favors prolific authors, so it is not a random sample of class (a)."
      - "Work counts link DBLP and OpenAlex only by DOI. 5,051 of 110,867 DBLP subset records have no DOI, and 94 OpenAlex works have a DOI that matches no DBLP record (normalization differences); such works can be counted twice for one iD if it appears on both sides. The ranking uses DBLP <author orcid> attributes and OpenAlex author.orcid as given; neither is verified identity."
      - "Record sizes have a heavy tail, up to 1.8 MB uncompressed in the sample."
      - "In the 2026-11-03 full run, 102 requested iDs returned another iD's record and records.jsonl.gz holds 61 duplicates. The fetch check requires only that orcid-identifier.path exists, not that it equals the requested iD. Consumers must key records by orcid-identifier.path, de-duplicate, and treat the requested-to-returned mapping (raw file name to path) as evidence, not as identity."
      - "The committed ORCID samples are not real researcher records, so they cannot show real coverage or data quality. The synthetic records claim real DBLP sample DOIs under fictitious names, which is a deliberate name mismatch against the works' real authors."
      - "The fictional test record's works are Crossref test DOIs (10.5555/...) plus one IEEE DOI, none in the DBLP sample, so it does not link to the DBLP sample."
      - "iDs from DBLP <author orcid> attributes are included as DBLP person-identity evidence. The work order names DBLP person records; see the dataset-engineer report under ASSUMPTIONS."
    validation_commands:
      - "bash datasets/scripts/validate.sh"
      - "cd scratch/datasets/orcid/full && shasum -a 256 -c SHA256SUMS"
      - "gzip -t scratch/datasets/orcid/full/records.jsonl.gz"
      - "bash datasets/scripts/fetch_orcid.sh --self-test"
      - "bash datasets/scripts/fetch_orcid.sh --full --plan"
      - "jq -e '.selected_total == 23000 and .class_a_ranking.rank == \"works\"' scratch/datasets/orcid/full/selection.json"
    samples:   # real-record review copy stays in scratch: scratch/datasets/orcid/sample/orcid-sample.minimized.jsonl (30 records, 77,554 bytes)
      - {path: datasets/samples/orcid/orcid-fictional-test-record.jsonl, records: 1, bytes: 935, license_basis: "ORCID's fictional demonstration record, committed under human ruling decision-1 (redistribution of ORCID API data in general is UNVERIFIED)"}
      - {path: datasets/samples/orcid/synthetic-orcid-records.jsonl, records: 3, bytes: 1801, license_basis: "synthetic, hand-authored for ScholarChain; contains only DOIs from the CC0 DBLP sample"}

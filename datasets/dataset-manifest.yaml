    coverage:   # observed 2026-11-03 from scratch/datasets/orcid/full/ (run-info.json, selection.json, ids.txt, unavailable-ids.txt, raw/, records.jsonl.gz)
      full_selected_ids: 23000                 # b 4,146 of 4,146; a 18,854 of 57,665; c 0 of 2,682; d 0 of 46,673 (selection.json)

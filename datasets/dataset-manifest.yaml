      - "https://github.com/ORCID/orcid-api-tutorial/blob/master/docs/display.md (repository of the ORCID GitHub organization), accessed 2026-11-03T00:53Z: uses https://orcid.org/0000-0002-1825-0097 as the example iD. The same iD appears in ORCID/orcid-php-demo-app and in ORCID/orcid-angular test specs (gh search code, 2026-11-03)."
      - "Corroborating third party: https://en.wikipedia.org/wiki/Josiah_Carberry, accessed 2026-11-02: 'He is assigned ORCID 0000-0002-1825-0097' and has 'a demonstration account used in training examples'. The ORCID support article on iD structure (support.orcid.org) answered HTTP 403 and was not read."
    access_rules: "Anonymous API, no credentials: 12 req/s, 40 burst/s, 25,000 reads/day per IP. Exceeding the burst returns 503, and exceeding the quota blocks further requests. A registered Public API client gets 100,000 reads/day, but its credentials are personal and are not used here. Non-commercial use only, with no continuous polling. Scripts pause 0.2 s, count each request against the UTC day it is made (requests-<UTC date>.count in the run directory), and stop at orcid.daily_request_cap = 24,000 requests in one UTC day (exit 7). The full run selects at most orcid.full_max_ids = 23,000 iDs (human ruling, phase-05 repair-01), so it fits in one UTC day and leaves a 2,000-read margin under the documented 25,000 for curl retries (up to 6 per request on 408, 429, or 5xx), which the counter does not see. Evidence accessed 2026-11-02."
    snapshot_date: "2026-11-03 (full run start date, UTC). API retrieval; the snapshot is the UTC date a run starts. Sample retrieved 2026-11-03T00:03Z."
    retrieval_date: "Sample 2026-11-03T00:03Z (UTC); fictional test record 2026-11-03T00:56:02Z. Full run: selection 2026-11-03T05:45:30Z, fetch 05:45:33Z to 09:15:04Z, records.jsonl.gz combined by 09:17:08Z (run-info.json retrieved_utc; log DONE line 09:18:10Z). One attempt, exit 0."
